name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify tag and package version
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          if [[ "v$version" != "${GITHUB_REF_NAME}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION $version" >&2
            exit 1
          fi

      - name: Run tests
        run: make test

      - name: Build portable skill
        run: make package

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          cat > release-notes.md <<'EOF'
          ## Install

          Download **`video-findings.zip`** for Codex, Claude Code, or OpenCode.
          It is the complete portable Agent Skill for every supported local harness.

          GitHub adds the two **Source code** archives automatically. They are repository
          snapshots, not the recommended skill download.
          EOF
          gh release create "${GITHUB_REF_NAME}" \
            "dist/video-findings.zip" \
            --title "Video Findings $version" \
            --notes-file release-notes.md
